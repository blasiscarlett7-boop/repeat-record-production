<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>重粉记录库</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--primary-dark:#1d4ed8;--sidebar:#111827;--sidebar-soft:#1f2937;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:var(--sidebar);color:#fff;padding:24px 16px}.brand{font-weight:800;font-size:20px;padding:4px 10px 24px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;color:#cbd5e1;padding:12px 14px;border-radius:10px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:var(--sidebar-soft);color:#fff}.main{padding:24px 28px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}.topbar h1{font-size:26px;margin:0}.meta,.small{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.stat-label{color:var(--muted);font-size:13px;margin-bottom:8px}.stat-value{font-size:28px;font-weight:800}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select,.form-grid input,.form-grid select{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;background:#fff;outline:none}.form-grid textarea{min-height:220px;border:1px solid #d1d5db;border-radius:10px;padding:12px;resize:vertical;line-height:1.6}.toolbar input{min-width:290px}.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}.btn-ghost{background:#eef2ff;color:#1e40af}.btn-danger{background:#fee2e2;color:#991b1b}.section{display:none}.section.active{display:block}.form-card{max-width:800px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:#475569;font-weight:700}.field.full{grid-column:1/-1}.notice{padding:14px 16px;border-radius:12px;margin-top:14px;display:none}.notice.show{display:block}.notice.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.notice.err{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.result-box{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;margin-top:14px}.result-row{display:grid;grid-template-columns:150px 1fr;padding:8px 0;border-bottom:1px dashed #e5e7eb}.result-row:last-child{border-bottom:0}.result-row span:first-child{color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:#fff;min-width:860px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc;color:#475569}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.badge.normal{background:#dcfce7;color:#166534}.badge.repeat{background:#fef3c7;color:#92400e}.badge.disabled{background:#e5e7eb;color:#4b5563}.role-pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:700;font-size:12px}.login-screen{position:fixed;inset:0;background:#f5f7fb;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.1)}.login-card input{height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;width:100%}.batch-result{margin-top:16px}.batch-summary{font-weight:800;margin-bottom:10px}.batch-list{display:grid;gap:8px}.batch-item{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.batch-item.dup{border-color:#fed7aa;background:#fff7ed}.batch-item.added{border-color:#bbf7d0;background:#ecfdf5}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{padding:14px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px}}@media(max-width:640px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar input{min-width:100%;width:100%}}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen"><div class="login-card"><h2 style="margin:0 0 8px">重粉记录库</h2><p class="meta" style="margin:0 0 22px">正式服务器版</p><div class="field"><label>用户名</label><input id="loginUsername" /></div><div class="field" style="margin-top:14px"><label>密码</label><input id="loginPassword" type="password" /></div><button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:18px">登录</button><div class="notice err" id="loginError"></div></div></div>
<div class="app hidden" id="appRoot">
<aside class="sidebar"><div class="brand">重粉记录库</div><div class="nav"><button class="active" data-target="dashboard">首页</button><button data-target="search">重粉查询</button><button data-target="records" class="admin-only">记录库</button><button data-target="add">新增记录</button><button data-target="users" class="admin-only">用户管理</button></div></aside>
<main class="main"><div class="topbar"><div><h1 id="pageTitle">首页</h1><div class="meta">录入时间按美国东部时间显示</div></div><div style="display:flex;align-items:center;gap:10px"><span class="meta" id="who"></span><span class="role-pill" id="rolePill"></span><button class="btn btn-ghost" id="logoutBtn">退出</button></div></div>
<section id="dashboard" class="section active"><div class="grid"><div class="card"><div class="stat-label">总记录数</div><div class="stat-value" id="statTotal">0</div></div><div class="card"><div class="stat-label">今日新增</div><div class="stat-value" id="statToday">0</div></div><div class="card"><div class="stat-label">正常记录</div><div class="stat-value" id="statNormal">0</div></div><div class="card"><div class="stat-label">累计重粉次数</div><div class="stat-value" id="statRepeat">0</div></div></div><div class="card"><div style="font-weight:800;font-size:18px;margin-bottom:12px">快速查询</div><div class="toolbar"><input id="quickSearchInput" placeholder="输入客户号码"/><button class="btn btn-primary" id="quickSearchBtn">查询</button></div><div id="quickSearchResult"></div></div></section>
<section id="search" class="section"><div class="card"><div class="toolbar"><input id="searchInput" placeholder="输入客户号码进行查重"/><button class="btn btn-primary" id="searchBtn">查询</button></div><div id="searchResult"></div></div></section>
<section id="records" class="section"><div class="card"><div class="toolbar"><input id="tableSearch" placeholder="搜索客户号码 / 录入人"/><select id="statusFilter"><option value="">全部状态</option><option>正常</option><option>重粉</option><option>停用</option></select><button class="btn btn-ghost" id="recordsRefresh">刷新</button><button class="btn btn-ghost" id="exportBtn">导出CSV</button></div><div class="table-wrap"><table><thead><tr><th>客户号码</th><th>录入人</th><th>录入时间（ET）</th><th>状态</th><th>重粉次数</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table></div></div></section>
<section id="add" class="section"><div class="card form-card"><div class="form-grid"><div class="field full"><label>客户号码（支持批量录入）</label><textarea id="customerNumber" placeholder="每行一个号码，也支持逗号或分号分隔。例如：&#10;+1 (945) 408-7713&#10;19454087713&#10;+1 917 123 4567&#10;+1917123456"></textarea><div class="small">号码格式不限。系统会忽略 +、空格、括号、横线、点号等格式差异后查重。</div></div><div class="field"><label>录入人</label><input id="createdBy" disabled /></div></div><div style="margin-top:18px;display:flex;gap:10px"><button class="btn btn-primary" id="saveBtn">批量录入</button><button class="btn btn-ghost" id="clearBtn">清空</button></div><div id="addNotice" class="notice"></div><div id="batchResult" class="batch-result"></div></div></section>
<section id="users" class="section"><div class="card form-card"><div style="font-weight:800;font-size:18px;margin-bottom:16px">添加用户 / 管理员</div><div class="form-grid"><div class="field"><label>账号</label><input id="newUsername" /></div><div class="field"><label>密码</label><input id="newPassword" type="password" /></div><div class="field"><label>显示名称</label><input id="newDisplayName" /></div><div class="field"><label>角色</label><select id="newRole"><option value="staff">普通用户</option><option value="admin">管理员</option></select></div></div><button class="btn btn-primary" id="createUserBtn" style="margin-top:18px">添加账号</button><div id="userNotice" class="notice"></div></div><div class="card" style="margin-top:18px"><div style="font-weight:800;font-size:18px;margin-bottom:12px">现有账号</div><div class="table-wrap"><table style="min-width:640px"><thead><tr><th>账号</th><th>显示名称</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></section>
</main></div>
<script>
const $=id=>document.getElementById(id);let me=null,csrfToken=null;
async function api(url,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(csrfToken&&opts.method&&opts.method!=='GET')headers['X-CSRF-Token']=csrfToken;const r=await fetch(url,{headers,credentials:'same-origin',...opts});if(r.status===401){showLogin();throw new Error('请先登录')}const ct=r.headers.get('content-type')||'';const data=ct.includes('application/json')?await r.json():await r.text();if(!r.ok)throw new Error(data.error||'操作失败');return data}
function showLogin(){$('appRoot').classList.add('hidden');$('loginScreen').classList.remove('hidden')}
function showApp(){$('loginScreen').classList.add('hidden');$('appRoot').classList.remove('hidden');document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden',me.role!=='admin'));$('who').textContent=me.display_name;$('rolePill').textContent=me.role==='admin'?'管理员':'普通用户';$('createdBy').value=me.display_name;loadStats()}
async function boot(){try{const d=await api('/api/me');me=d.user;csrfToken=d.csrf_token;showApp()}catch{showLogin()}}
$('loginBtn').onclick=async()=>{try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUsername').value,password:$('loginPassword').value})});me=d.user;csrfToken=d.csrf_token;$('loginError').className='notice err';showApp()}catch(e){$('loginError').textContent=e.message;$('loginError').className='notice err show'}};
$('logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});me=null;csrfToken=null;showLogin()};
document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{const target=btn.dataset.target;if(btn.classList.contains('admin-only')&&me.role!=='admin')return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(target).classList.add('active');$('pageTitle').textContent=btn.textContent;if(target==='records')loadRecords();if(target==='users')loadUsers();if(target==='dashboard')loadStats()});
async function loadStats(){const d=await api('/api/stats');$('statTotal').textContent=d.total;$('statToday').textContent=d.today;$('statNormal').textContent=d.normal;$('statRepeat').textContent=d.repeats}
function searchHtml(d){if(!d.found)return '<div class="result-box"><b style="color:#166534">未发现重复记录</b></div>';const r=d.record;return '<div class="result-box"><div style="font-weight:800;color:#9a3412;margin-bottom:8px">⚠ 重粉</div><div class="result-row"><span>重了谁的</span><b>'+esc(r.created_by)+'</b></div><div class="result-row"><span>重粉次数</span><b>'+r.duplicate_count+' 次</b></div><div class="result-row"><span>原录入时间</span><span>'+esc(r.created_at)+'</span></div><div class="result-row"><span>状态</span><span>'+esc(r.status)+'</span></div></div>'}
async function doSearch(inputId,resultId){try{$(resultId).innerHTML=searchHtml(await api('/api/search',{method:'POST',body:JSON.stringify({q:$(inputId).value})}))}catch(e){$(resultId).innerHTML='<div class="notice err show">'+esc(e.message)+'</div>'}}
$('quickSearchBtn').onclick=()=>doSearch('quickSearchInput','quickSearchResult');$('searchBtn').onclick=()=>doSearch('searchInput','searchResult');
$('saveBtn').onclick=async()=>{const text=$('customerNumber').value.trim();$('batchResult').innerHTML='';try{const d=await api('/api/records/batch',{method:'POST',body:JSON.stringify({numbers:text})});let added=0,dup=0,invalid=0;const items=d.results.map(r=>{if(r.result==='added'){added++;return '<div class="batch-item added"><b>'+esc(r.number)+'</b> — 已新增</div>'}if(r.result==='duplicate'){dup++;return '<div class="batch-item dup"><b>'+esc(r.number)+'</b> — 重粉；重了 <b>'+esc(r.owner)+'</b> 的；累计 <b>'+r.duplicate_count+'</b> 次；原录入 '+esc(r.original_created_at)+'</div>'}invalid++;return '<div class="batch-item">'+esc(r.number)+' — 无效号码</div>'}).join('');$('batchResult').innerHTML='<div class="batch-summary">新增 '+added+' 个 · 重粉 '+dup+' 个 · 无效 '+invalid+' 个</div><div class="batch-list">'+items+'</div>';$('addNotice').textContent='批量处理完成';$('addNotice').className='notice ok show';loadStats()}catch(e){$('addNotice').textContent=e.message;$('addNotice').className='notice err show'}};
$('clearBtn').onclick=()=>{$('customerNumber').value='';$('batchResult').innerHTML='';$('addNotice').className='notice'};
async function loadRecords(){if(me.role!=='admin')return;const q=$('tableSearch').value.trim(),s=$('statusFilter').value;const d=await api('/api/records/search',{method:'POST',body:JSON.stringify({q,status:s})});$('recordsBody').innerHTML=d.records.map(r=>'<tr><td>'+esc(r.customer_number)+'</td><td>'+esc(r.created_by)+'</td><td>'+esc(r.created_at)+'</td><td><span class="badge '+(r.status==='正常'?'normal':r.status==='重粉'?'repeat':'disabled')+'">'+esc(r.status)+'</span></td><td>'+r.duplicate_count+'</td><td><select onchange="changeStatus('+r.id+',this.value)"><option '+(r.status==='正常'?'selected':'')+'>正常</option><option '+(r.status==='重粉'?'selected':'')+'>重粉</option><option '+(r.status==='停用'?'selected':'')+'>停用</option></select> <button class="btn btn-danger" onclick="deleteRecord('+r.id+')">删除</button></td></tr>').join('')||'<tr><td colspan="6" class="meta">暂无记录</td></tr>'}
$('recordsRefresh').onclick=loadRecords;$('tableSearch').oninput=debounce(loadRecords,300);$('statusFilter').onchange=loadRecords;$('exportBtn').onclick=()=>{location.href='/api/records/export.csv'};
window.changeStatus=async(id,status)=>{await api('/api/records/'+id,{method:'PATCH',body:JSON.stringify({status})});loadRecords()};window.deleteRecord=async id=>{if(!confirm('确定删除这条记录？'))return;await api('/api/records/'+id,{method:'DELETE'});loadRecords();loadStats()};
async function loadUsers(){if(me.role!=='admin')return;const d=await api('/api/users');$('usersBody').innerHTML=d.users.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.display_name)+'</td><td>'+(u.role==='admin'?'管理员':'普通用户')+'</td><td>'+(u.is_active?'启用':'停用')+'</td><td>'+(u.id===me.id?'当前账号':u.is_active?'<button class="btn btn-danger" onclick="deleteUser('+u.id+')">停用</button>':'')+'</td></tr>').join('')}
$('createUserBtn').onclick=async()=>{try{await api('/api/users',{method:'POST',body:JSON.stringify({username:$('newUsername').value,password:$('newPassword').value,display_name:$('newDisplayName').value,role:$('newRole').value})});$('userNotice').textContent='账号创建成功';$('userNotice').className='notice ok show';$('newUsername').value='';$('newPassword').value='';$('newDisplayName').value='';loadUsers()}catch(e){$('userNotice').textContent=e.message;$('userNotice').className='notice err show'}};
window.deleteUser=async id=>{if(!confirm('确定停用这个账号？'))return;try{await api('/api/users/'+id,{method:'DELETE'});loadUsers()}catch(e){alert(e.message)}};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
boot();
</script>
</body></html>
